services:
  postgres:
    image: ${REG:-docker.m.daocloud.io}/library/postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentdev}
      POSTGRES_DB: agentluoss
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentluoss"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: ${REG:-docker.m.daocloud.io}/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

volumes:
  pgdata:
  redisdata:

networks:
  backend:
