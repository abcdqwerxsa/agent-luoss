syntax = "proto3";

package agentluoss.v1.usage;

option go_package = "agentluoss/proto/gen/usage;usagepb";

service Usage {
  // ---- internal (task-svc funnels agent usage) ----
  rpc ReportUsage(ReportUsageRequest) returns (ReportUsageResponse);
  rpc ReportToolCall(ReportToolCallRequest) returns (ReportToolCallResponse);
  rpc CheckQuota(CheckQuotaRequest) returns (CheckQuotaResponse);

  // ---- admin-facing (via gateway) ----
  rpc SetQuota(SetQuotaRequest) returns (SetQuotaResponse);
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  rpc GetTaskUsage(GetTaskUsageRequest) returns (GetTaskUsageResponse);
  // ---- user-facing ----
  rpc GetMyUsage(GetMyUsageRequest) returns (GetMyUsageResponse);
}

message ReportUsageRequest {
  string task_id = 1;
  string user_id = 2;
  string provider = 3;
  string model_id = 4;
  int64 input_tokens = 5;
  int64 output_tokens = 6;
  int64 cache_read_tokens = 7;
  int64 cache_write_tokens = 8;
  double cost_usd = 9;
  int64 ts = 10; // unix ms
  string expert_id = 11; // "" = no expert bound
}

message ReportUsageResponse {}

message ReportToolCallRequest {
  string user_id = 1;
  string expert_id = 2;
  string tool = 3;
  int64 ts = 4; // unix ms
}

message ReportToolCallResponse {}

message CheckQuotaRequest {
  string user_id = 1;
}

message CheckQuotaResponse {
  bool allowed = 1;
  string reason = 2;
  double used_usd = 3;
  double limit_usd = 4;
}

message SetQuotaRequest {
  string user_id = 1;
  double monthly_limit_usd = 2; // <=0 removes custom quota (falls back to default)
}

message SetQuotaResponse {}

message GetUsageSummaryRequest {
  string user_id = 1; // empty = all users (admin)
  int32 days = 2;     // lookback window, default 30; ignored when from_ts set
  int64 from_ts = 3;  // unix ms, explicit range start
  int64 to_ts = 4;    // unix ms, range end (0 = now)
}

message UsageRow {
  string day = 1;       // YYYY-MM-DD
  string user_id = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 total_tokens = 5;
  double cost_usd = 6;
  int32 task_count = 7;
}

message GetUsageSummaryResponse {
  repeated UsageRow rows = 1;
  repeated ModelUsageRow by_model = 2;   // aggregated over the same window
  repeated UserUsageRow top_users = 3;  // ranked by cost, max 20
  repeated ExpertUsageRow by_expert = 4;
  repeated DeptUsageRow by_department = 5;
  repeated TaskUsageRow by_task = 6;     // highest-cost tasks, max 20
  int64 dau = 7;
  int64 wau = 8;
  int64 mau = 9;
  repeated ToolUsageRow by_tool = 10;
  repeated UserQuotaRow quotas = 11;    // all users: limit + month spend
}

message ExpertUsageRow {
  string expert_id = 1;
  string name = 2;
  int64 total_tokens = 3;
  double cost_usd = 4;
  int32 task_count = 5;
}

message DeptUsageRow {
  string department = 1;
  int64 total_tokens = 2;
  double cost_usd = 3;
  int32 users = 4;
  int32 task_count = 5;
}

message TaskUsageRow {
  string task_id = 1;
  string title = 2;
  string user_id = 3;
  int64 total_tokens = 4;
  double cost_usd = 5;
}

message ToolUsageRow {
  string tool = 1;
  int64 calls = 2;
}

message UserQuotaRow {
  string user_id = 1;
  double monthly_limit_usd = 2;
  double month_used_usd = 3;
}

message ModelUsageRow {
  string provider = 1;
  string model_id = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 cache_read_tokens = 5;
  int64 cache_write_tokens = 6;
  int64 total_tokens = 7;
  double cost_usd = 8;
  int32 task_count = 9; // distinct tasks touching this model
}

message UserUsageRow {
  string user_id = 1;
  int64 total_tokens = 2;
  double cost_usd = 3;
  int32 task_count = 4;
}

message GetMyUsageRequest {
  string user_id = 1;
}

message GetMyUsageResponse {
  double month_used_usd = 1;
  double month_limit_usd = 2;
  repeated UsageRow recent_days = 3;
}

message GetTaskUsageRequest {
  string task_id = 1;
}

message GetTaskUsageResponse {
  repeated ModelUsageRow by_model = 1;
  int64 total_tokens = 2;
  double cost_usd = 3;
}

message ListAuditLogsRequest {
  string actor = 1;    // filter by user id/username
  string action = 2;   // filter by action, e.g. "task.create"
  int64 from_ts = 3;
  int64 to_ts = 4;
  int32 limit = 5;
  int32 offset = 6;
  string resource = 7; // keyword, ILIKE match on resource
}

message AuditLog {
  string id = 1;
  string actor = 2;
  string action = 3;
  string resource = 4;  // e.g. "task/<id>"
  string detail = 5;    // JSON
  string ip = 6;
  int64 ts = 7;
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  int32 total = 2;
}
