syntax = "proto3";

package agentluoss.v1.iam;

option go_package = "agentluoss/proto/gen/iam;iampb";

service IAM {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // ---- internal (caps-svc resolves effective capabilities) ----
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // ---- departments ----
  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (UpdateDepartmentResponse);
  rpc DeleteDepartment(DeleteDepartmentRequest) returns (DeleteDepartmentResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
}

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string role = 4;   // "admin" | "member"
  string status = 5; // "active" | "disabled"
  string department_id = 7; // empty = no department
  int64 created_at = 6;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3; // seconds
  User user = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
  string role = 4;
  string department_id = 5;
}

message CreateUserResponse {
  User user = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  string display_name = 2;
  string role = 3;
  string status = 4;
  string password = 5;       // non-empty = reset
  string department_id = 6;  // "-" clears the department
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message Department {
  string id = 1;
  string name = 2;
  int64 created_at = 3;
}

message CreateDepartmentRequest {
  string id = 1;   // slug; empty = generated
  string name = 2;
}

message CreateDepartmentResponse {
  Department department = 1;
}

message UpdateDepartmentRequest {
  string id = 1;
  string name = 2;
}

message UpdateDepartmentResponse {
  Department department = 1;
}

message DeleteDepartmentRequest {
  string id = 1;
}

message DeleteDepartmentResponse {}

message ListDepartmentsRequest {}

message ListDepartmentsResponse {
  repeated Department departments = 1;
}
